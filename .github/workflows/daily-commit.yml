name: Dynamic Auto Commit

on:
  schedule:
    # 1. High frequency: Every hour on Sundays (0-23 UTC)
    - cron: '0 * * * 0'
    
    # 2. Low frequency: Once a day (at 12:00 AM UTC) from Monday to Saturday
    - cron: '0 0 * * 1-6'
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # ⚡ FIXED SYNTAX LAYER: Uses absolute single-token validation structures safely
        token: ${{ secrets.PAT_SECRET }}
        persist-credentials: true

    - name: Make a change to the README
      run: |
        echo "Last automated update: $(date)" >> README.md

    - name: Commit and Push changes
      run: |
        # 👤 Matches your verified account parameters explicitly
        git config --global user.name "bolambaoz"
        git config --global user.email "p0bring0yam0t@gmail.com"
        
        git add README.md
        
        # Safe checkpoint prevents error breaks if no new file changes exist
        git diff-index --quiet HEAD || git commit -m "Automated update: $(date)"
        
        # Pushes directly back up to your main branch seamlessly using your token profiles
        git push origin main
