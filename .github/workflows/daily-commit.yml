name: Dynamic Auto Commit

on:
  schedule:
    # 1. High frequency: Every hour on Sundays (0-23 UTC)
    - cron: '0 * * * 0'
    
    # 2. Low frequency: Once a day (at 12:00 AM UTC) from Monday to Saturday
    - cron: '0 0 * * 1-6'
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make a change to the README
      run: |
        echo "Last automated update: $(date)" >> README.md

    - name: Commit and Push changes
      run: |
        git config --global user.name "Zee"
        git config --global user.email "p0bring0yam0t@gmail.com"
        git add README.md
        git commit -m "Automated update: $(date)"
        git push
