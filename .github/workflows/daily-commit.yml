name: Dynamic Auto Commit

on:
  schedule:
    # ⚡ MODIFIED: Fires accurately at minute 0 of every single hour, 24/7, 365 days a year
    - cron: '0 * * * *'
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_SECRET }}
        persist-credentials: true

    - name: Fetch Dynamic Developer Quote
      run: |
        echo "### 💻 Daily Development Sprint Lore" > patch.txt
        echo "Generated on: $(date)" >> patch.txt
        echo "" >> patch.txt
        
        # Pulls live parsed quote details securely using standard curl utilities
        QUOTE_DATA=$(curl -s "https://azurewebsites.net")
        
        if [ -z "$QUOTE_DATA" ] || [ $(echo "$QUOTE_DATA" | wc -c) -le 10 ]; then
          echo "> \"Simplicity is the soul of efficiency.\" — Austin Freeman" >> patch.txt
        else
          TEXT=$(echo "$QUOTE_DATA" | sed -n 's/.*"en":"\([^"]*\)".*/\1/p')
          AUTHOR=$(echo "$QUOTE_DATA" | sed -n 's/.*"author":"\([^"]*\)".*/\1/p')
          echo "> \"$TEXT\" — $AUTHOR" >> patch.txt
        fi
        
        echo "" >> patch.txt
        echo "---" >> patch.txt
        
        cat patch.txt >> README.md
        rm patch.txt

    - name: Commit and Push changes
      run: |
        git config --global user.name "bolambaoz"
        git config --global user.email "p0bring0yam0t@gmail.com"
        
        git add README.md
        
        git diff-index --quiet HEAD || git commit -m "Feat: hourly documentation tracking synchronization loop"
        
        git push origin main
