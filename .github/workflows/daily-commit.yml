
name: Daily Auto Commit

on:
  schedule:
    # This runs the script every day at 12:00 AM UTC (Change to your preferred time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make a change to the README
      run: |
        echo "Last automated update: $(date)" >> README.md

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Automated daily update: $(date)"
        git push
